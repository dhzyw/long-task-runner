name: Windows tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.14']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Compile scripts
        run: python -m compileall -q scripts
      - name: Process lifecycle and artifact tests
        run: python scripts/test_runner.py --root "$env:RUNNER_TEMP/long-task-runner-tests" --report test-results/runner.json
      - name: Read-only remote watcher tests
        run: python scripts/test_remote.py --root "$env:RUNNER_TEMP/long-task-runner-tests" --report test-results/remote.json
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: results-python-${{ matrix.python }}
          path: test-results/*.json
          retention-days: 7
